name: Build

on:
  push:
    branches: [main]
    tags: ['v*']   # pushing a tag like v0.3.1 also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: FlickDesk (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        working-directory: windows/FlickDesk
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ../../out/windows
      - uses: actions/upload-artifact@v4
        with:
          name: FlickDesk-windows-x64
          path: out/windows/FlickDesk.exe

  android:
    name: Flick (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Flick-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Name the files after the version
        run: |
          v="${GITHUB_REF_NAME}"
          mv dist/FlickDesk-windows-x64/FlickDesk.exe "dist/FlickDesk-${v}-windows-x64.exe"
          mv dist/Flick-android-debug/*.apk "dist/Flick-${v}-android.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: Flick ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/FlickDesk-*-windows-x64.exe
            dist/Flick-*-android.apk
