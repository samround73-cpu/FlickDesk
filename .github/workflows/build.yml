name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: FlickDesk (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        working-directory: windows/FlickDesk
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ../../out/windows
      - uses: actions/upload-artifact@v4
        with:
          name: FlickDesk-windows-x64
          path: out/windows/FlickDesk.exe

  android:
    name: Flick (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Flick-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    name: Publish GitHub Release
    # Runs on pushes to main (and v* tags). Publishes once per version: bump <Version> in
    # FlickDesk.csproj (and versionName in android/app/build.gradle.kts) to cut a new release.
    if: github.event_name == 'push'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(grep -oP '(?<=<Version>)[^<]+' windows/FlickDesk/FlickDesk.csproj)"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists - nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.publish == 'true'
        with:
          path: dist
      - name: Give the files stable names (so /releases/latest/download/<name> always works)
        if: steps.ver.outputs.publish == 'true'
        run: |
          v="${{ steps.ver.outputs.tag }}"
          mv dist/FlickDesk-windows-x64/FlickDesk.exe dist/FlickDesk-windows-x64.exe
          mv dist/Flick-android-debug/*.apk dist/Flick-android.apk
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Flick ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/FlickDesk-windows-x64.exe
            dist/Flick-android.apk
