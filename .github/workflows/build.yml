name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: FlickDesk (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file exe
        working-directory: windows/FlickDesk
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o ../../out/windows
      - uses: actions/upload-artifact@v4
        with:
          name: FlickDesk-windows-x64
          path: out/windows/FlickDesk.exe

  android:
    name: Flick (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Flick-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
